<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canadian ISMI — Interactive Chart</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
  }
  h1 { font-size: 1.4em; margin-bottom: 4px; }
  p.subtitle { color: #666; margin-top: 0; }
  #chart { width: 100%; height: 550px; }
</style>
</head>
<body>

<h1>Inflation Shock Momentum Index (ISMI) — Canada</h1>
<p class="subtitle">1991 Q2 – 2026 Q1, disaggregated HFCE categories (StatCan, table 36-10-0124-01)</p>

<div id="chart">Loading data…</div>

<script>
Papa.parse("ismi_data.csv", {
  download: true,
  header: true,
  dynamicTyping: true,
  complete: function(results) {
    const rows = results.data.filter(r => r.date && r.ISMI !== null);

    // "date" comes from R as a yearqtr-style string like "1991 Q2".
    // Convert it to a real JS Date (first month of the quarter) so
    // Plotly's date axis and range slider work correctly.
    function quarterToDate(q) {
      const match = q.match(/(\d{4})\s*Q([1-4])/);
      if (!match) return null;
      const year = parseInt(match[1]);
      const month = (parseInt(match[2]) - 1) * 3;
      return new Date(year, month, 1);
    }

    const dates = rows.map(r => quarterToDate(r.date));
    const ismi = rows.map(r => r.ISMI);
    const positive = rows.map(r => r.positive_share);
    const negative = rows.map(r => r.negative_share);

    const traceISMI = {
      x: dates, y: ismi, name: "ISMI",
      type: "scatter", mode: "lines",
      line: { color: "#1f4e79", width: 2 }
    };
    const tracePositive = {
      x: dates, y: positive, name: "Positive share",
      type: "scatter", mode: "lines",
      line: { color: "#c0392b", width: 1, dash: "dot" },
      visible: "legendonly"
    };
    const traceNegative = {
      x: dates, y: negative, name: "Negative share",
      type: "scatter", mode: "lines",
      line: { color: "#2874a6", width: 1, dash: "dot" },
      visible: "legendonly"
    };

    const layout = {
      xaxis: {
        title: "",
        rangeslider: { visible: true },
        type: "date"
      },
      yaxis: { title: "ISMI (positive share − negative share)", zeroline: true },
      legend: { orientation: "h", y: 1.15 },
      margin: { t: 30 },
      shapes: [{
        type: "line", x0: dates[0], x1: dates[dates.length - 1],
        y0: 0, y1: 0, line: { color: "grey", width: 1, dash: "dot" }
      }]
    };

    Plotly.newPlot("chart", [traceISMI, tracePositive, traceNegative], layout,
                    { responsive: true });
  },
  error: function(err) {
    document.getElementById("chart").innerText =
      "Could not load ismi_data.csv — make sure it's in the same folder as this file.";
  }
});
</script>

</body>
</html>
